services:
  api:
    build: .
    ports:
      - "5000:8080"
    environment:
      - Jwt__Key=ecom-demo-local-secret-32b-please-rotate-in-production
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3