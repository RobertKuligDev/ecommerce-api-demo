name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/EcomDemo.Tests/TestResults/*/coverage.cobertura.xml

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ecom-demo-api:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d --name ecom-demo-test -p 5000:8080 ecom-demo-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop ecom-demo-test